<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sneaky Dog 3D — автотесты</title>
<style>
body{margin:16px;background:#0c241f;color:#fff5d9;font:14px/1.45 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 6px;color:#f8d36c}#sum{font-weight:800;margin:0 0 12px}
table{border-collapse:collapse;width:100%;max-width:1100px}td{padding:5px 8px;border-bottom:1px solid #ffffff1a;vertical-align:top}
td:first-child{width:22px;font-weight:900}.ok{color:#a8de8a}.fail{color:#ed6455}.info{color:#7fc6e8}
#frames iframe{border:1px solid #ffffff33;margin:8px 8px 0 0;background:#000}
</style>
</head>
<body>
<h1>Sneaky Dog 3D — автотесты</h1>
<p id="sum">Идёт прогон…</p>
<table id="out"></table>
<div id="frames"></div>
<script>
// Runs the game in iframes with ?test and drives it frame by frame through SneakyDog3D.test (deterministic, independent of
// the real clock). Run before every commit: open tests.html, wait for the summary line; window.testResults has the details.
'use strict';
const results=[];window.testResults=results;
function report(kind,name,detail){results.push({kind,name,detail});const tr=document.createElement('tr');
 tr.innerHTML=`<td class="${kind}">${kind==='ok'?'✓':kind==='fail'?'✗':'i'}</td><td>${name}</td><td>${detail}</td>`;document.getElementById('out').appendChild(tr)}
const check=(name,ok,detail)=>report(ok?'ok':'fail',name,detail);
function frame(w,h){return new Promise((res,rej)=>{const f=document.createElement('iframe');f.width=w;f.height=h;f.src='index.html?test&t='+Date.now();
 document.getElementById('frames').appendChild(f);const t0=Date.now();
 const poll=()=>{let g;try{g=f.contentWindow.SneakyDog3D}catch{}if(g&&g.test)res({f,G:g,T:g.test,win:f.contentWindow});else if(Date.now()-t0>30000)rej(new Error('игра не загрузилась за 30 с'));else setTimeout(poll,100)};poll()})}
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// A gardener must never stand still longer than 8 s outside the stops in his schedule (the 3D-0.11 sticking bug).
function stillMonitor(T){const track=new Map();let worst=0,where=null;
 return {tick(){for(const g of T.state().guards){let t=track.get(g);if(!t){t={x:g.x,y:g.y,s:0};track.set(g,t)}
   // Planned stops: a scheduled wait, the short alert look, and the look-around once he reached (or gave up on) an
   // inspect / search point. The 3D-0.11 bug is a gardener that never reaches his point — that is still counted.
   const atPoint=(g.state==='inspect'||g.state==='search')&&(g.arrived||(g.target&&d2(g,g.target)<21));
   const planned=(g.state==='patrol'&&g.watch>0)||g.alertLook>0||atPoint;
   if(planned||Math.hypot(g.x-t.x,g.y-t.y)>6){t.x=g.x;t.y=g.y;t.s=0}else{t.s+=1/60;if(t.s>worst){worst=t.s;where={x:Math.round(g.x),y:Math.round(g.y),state:g.state}}}}},
  get worst(){return worst},get where(){return where}}}

// A simple bot: follows A* waypoints with the stick in world directions.
function bot(T){let goal=null,path=[],repath=0;
 return {go(target,len){const p=T.state().player;if(!goal||d2(goal,target)>1){goal=target;path=[];repath=0}
   repath-=1/60;if(repath<=0){path=T.lineClear(p,goal,14)?[]:T.findPath(p,goal);repath=.5}
   let next=path[0]||goal;while(path.length&&d2(p,next)<14){path.shift();next=path[0]||goal}
   T.stick(next.x-p.x,next.y-p.y,len);return d2(p,goal)},
  stop(){T.stick(0,0,0)}}}

// Bot plays a whole level: corner mark (far from the gardener) → hide in a bush → when the gardener leaves for the tap:
// the pile on the bed → the hydrant mark on the way back → run to the far exit.
function playLevel(T,breed){T.start(breed);const C=T.consts,B=bot(T),mon=stillMonitor(T);
 const deed=i=>T.state().deeds[i],[pileI,hydI,cornerI]=[0,1,2],bush={x:598,y:406},farExit=C.EXITS.find(e=>e.id==='far');
 let phase='toCorner',waited=0;const log=[];const set=p=>{phase=p;log.push(p+'@'+T.state().elapsed.toFixed(1))};
 T.step(400,()=>{mon.tick();const s=T.state(),g=s.guards[0],tapIdx=g.pts.findIndex(p=>p.icon==='🚰');
  switch(phase){
   case 'toCorner':if(B.go(deed(cornerI),.6)<12){B.stop();set('markCorner')}break;
   case 'markCorner':T.hold(true);if(deed(cornerI).done){T.hold(false);set('toBush')}break;
   case 'toBush':if(B.go(bush,.6)<10){B.stop();set('wait')}break;
   case 'wait':waited+=1/60;if(g.state==='patrol'&&g.idx===tapIdx&&d2(g,C.zone)>250)set('toBed');break;
   case 'toBed':if(B.go(deed(pileI),.7)<20){B.stop();set('pile')}break;
   case 'pile':T.hold(true);if(deed(pileI).done){T.hold(false);set('toHydrant')}break;
   case 'toHydrant':if(B.go(deed(hydI),.7)<12){B.stop();set('markHydrant')}break;
   case 'markHydrant':T.hold(true);if(deed(hydI).done){T.hold(false);set('toExit')}break;
   case 'toExit':B.go(farExit,1);break}});
 const s=T.state();return {state:s.state,elapsed:s.elapsed,spotted:s.spotted,accident:s.accident,discovered:s.discovered,phase,waited,log,still:mon.worst,stillWhere:mon.where}}

async function run(){
 // ---- 1. Bot passes the level with every playable breed; no gardener sticks.
 {const {T,f}=await frame(844,390);
  for(const breed of ['lab','jack','corgi']){const r=playLevel(T,breed);
   check(`Бот проходит парк 1 (${breed})`,r.state==='won',`итог ${r.state}, ${r.elapsed.toFixed(1)} с, ждал окна ${r.waited.toFixed(1)} с, заметили: ${r.spotted?'да':'нет'}, улику нашли: ${r.discovered?'да':'нет'}, авария: ${r.accident?'да':'нет'}; фазы: ${r.log.join(' → ')}`);
   check(`Садовник не стоит дольше 8 с вне расписания (бот, ${breed})`,r.still<8,`наибольший простой ${r.still.toFixed(1)} с${r.stillWhere?' в '+JSON.stringify(r.stillWhere):''}`)}
  T.start('lab');f.remove()}

 // ---- 2. Gardener sticking scenarios from 3D-0.11.
 {const {T,f}=await frame(844,390);const C=T.consts;
  const scen=[
   ['подозрение на куст, собаки там нет',g=>{g.state='patrol';g.watch=0;g.x=728;g.y=316;g.sus=.5;g.alertLook=.05;g.lookAt={x:598,y:406}}],
   ['цель внутри изгороди',g=>{g.state='inspect';g.target={x:343,y:240};g.x=483;g.y=360;g.wait=0;g.path=[]}],
   ['садовник внутри изгороди, погоня',g=>{g.state='chase';g.target={x:500,y:240};g.x=343;g.y=240;g.sus=1;g.seen=0;g.path=[]}],
   ['цель за забором',g=>{g.state='inspect';g.target={x:500,y:30};g.x=500;g.y=170;g.wait=0;g.path=[]}]];
  for(const [name,setup] of scen){T.start('lab');T.place(900,650);const g=T.state().guards[0];setup(g);const mon=stillMonitor(T);let back=null;
   T.step(25,t=>{T.place(900,650);mon.tick();if(back===null&&g.state==='patrol'&&t>.2)back=t});
   check(`Садовник не залипает: ${name}`,mon.worst<8&&back!==null,`вернулся к патрулю через ${back===null?'—':back.toFixed(1)+' с'}, наибольший простой ${mon.worst.toFixed(1)} с`)}
  f.remove()}

 // ---- 3. Stamina never sticks at zero with the stick held; the dog keeps walking and recovers on release.
 {const {T,f}=await frame(844,390);T.start('lab');T.state().guards[0].x=900;T.state().guards[0].y=650;
  let reachedRun=false,minAfter=9,zeroT=0,dry=null;
  T.step(25,t=>{T.place(400,420);T.stick(1,0,1);const s=T.state();if(s.speedMult>1.3)reachedRun=true;if(reachedRun&&s.stamina<20)minAfter=Math.min(minAfter,s.speedMult);if(s.stamina<.01)zeroT+=1/60;if(dry===null&&s.stamina<5)dry=t});
  const low=T.state().stamina;T.step(6,()=>{T.place(400,420);T.stick(1,0,.6)});const rec=T.state().stamina;
  check('Выносливость не залипает на нуле при зажатом стике',reachedRun&&minAfter>=.98&&zeroT<.5&&rec>40,`бег был: ${reachedRun?'да':'нет'}; после исчерпания скорость не ниже ×${minAfter.toFixed(3)}; на нуле ${zeroT.toFixed(2)} с; выдохлась к ${dry===null?'—':dry.toFixed(1)+' с'}; через 6 с шага выносливость ${low.toFixed(1)} → ${rec.toFixed(1)}`);
  f.remove()}

 // ---- 4. Noise ring edge and the gardener's reaction coincide.
 {const {T,f}=await frame(844,390);const rows=[];let ok=true;
  for(const D of [120,150,164,170,200]){T.start('lab');const g=T.state().guards[0];
   // The gardener stands still, back to the dog; until our ring is out he is kept in patrol (earlier, quieter rings are ignored).
   const pin=()=>{T.place(400,420);g.x=400+D;g.y=420;g.angle=0;g.lookBase=0;g.watch=600;g.step={icon:'💧',sp:0,amp:0};g.sus=0;g.alertLook=0};
   let ring=null;for(let i=0;i<360&&!ring;i++){pin();g.state='patrol';T.stick(1,0,1);T.step(1/60);ring=T.state().rings.find(r=>r.rad>160&&r.age<.05)||null}
   T.stick(0,0,0);for(const r of T.state().rings)if(r!==ring)r.heard.add(g);g.state='patrol';const hold=pin;
   let heardAt=null,edge=null;T.step(1.5,()=>{hold();if(heardAt===null&&g.state==='inspect'){heardAt=ring.age;edge=ring.rad*Math.min(1,ring.age/ring.life)}});
   const should=ring&&D<=ring.rad,fine=!!ring&&(should?heardAt!==null&&Math.abs(edge-D)<=3:heardAt===null);ok=ok&&fine;
   rows.push(`${D}: ${heardAt!==null?'услышал при крае '+edge.toFixed(1):'не услышал'}${fine?'':' ✗'}`)}
  check('Край кольца шума и реакция садовника совпадают',ok,`радиус ${T.consts.NOISE} · `+rows.join(' · '));f.remove()}

 // ---- 5. Deeds: progress holds DEED_GRACE s after a break, then drains 1.5× faster; a pile can be done in two goes; need overflow.
 // The gardener is parked at the tap, back to the park, for the whole check.
 const park=g=>{g.state='patrol';g.x=230;g.y=182;g.watch=9999;g.step={icon:'🚰',sp:0,amp:0};g.lookBase=-Math.PI/2;g.angle=-Math.PI/2};
 {const {T,f}=await frame(844,390);T.start('lab');const C=T.consts,s=T.state(),pile=s.deeds[0];park(s.guards[0]);
  T.place(pile.x,pile.y);T.stick(0,0,0);T.hold(true);T.step(3,()=>T.place(pile.x,pile.y));T.hold(false);const p3=pile.p;
  T.step(1.5);const pGrace=pile.p;T.step(1.5);const pDrain=pile.p;
  T.hold(true);T.step(C.DEED_KIND.pile.hold,()=>T.place(pile.x,pile.y));T.hold(false);
  const expDrain=p3-(1.5-(C.DEED_GRACE-1.5))*C.DEED_DRAIN;
  check('Срыв дела не мгновенный, куча в два захода',Math.abs(pGrace-p3)<.02&&Math.abs(pDrain-expDrain)<.05&&pile.done,`3 с удержания → ${p3.toFixed(2)}; через 1.5 с без кнопки ${pGrace.toFixed(2)}; через 3 с ${pDrain.toFixed(2)} (ожидалось ${expDrain.toFixed(2)}); второй заход — куча ${pile.done?'готова':'не готова'}`);
  T.start('lab');const s2=T.state();park(s2.guards[0]);T.step(C.NEED_TIME+.5,()=>T.place(598,406));const s3=T.state();
  check('Потребность: переполнение — дело на месте, улика, без проигрыша',s3.accident&&s3.deeds[0].done&&s3.evidence.length===1&&s3.state==='playing',`через ${C.NEED_TIME} с: авария ${s3.accident?'да':'нет'}, куча засчитана ${s3.deeds[0].done?'да':'нет'}, улик ${s3.evidence.length}, состояние ${s3.state}`);
  f.remove()}

 // ---- 6. Level rule: the gardener's window ≥ deed time + 4–6 s (reported, not adjusted).
 {const {G,f}=await frame(844,390);const m=G.snapshot().metrics;const need=m.needWindow;
  check('Правило окна садовника (куча + 4–6 с)',m.window>=need[1],`окно у крана ${m.window.toFixed(1)} с, нужно ≥ ${need[0]}–${need[1]} с`);
  report(m.window>=m.allDeeds+4?'info':'fail','Все три дела за одно окно',`дела ${m.allDeeds.toFixed(1)} с (удержания 10 с + переходы клумба → гидрант → угол ящика) при окне ${m.window.toFixed(1)} с`);
  f.remove()}

 // ---- 7. Landscape layout: no overlaps on 844×390 and 932×430 (progress and gait label forced visible).
 for(const [w,h] of [[844,390],[932,430]]){const {T,win,f}=await frame(w,h);T.start('lab');T.step(.1);const doc=win.document;
  doc.getElementById('progress').style.display='block';const ga=doc.getElementById('gait');ga.hidden=false;ga.textContent='крадётся';doc.getElementById('need').hidden=false;
  await new Promise(r=>setTimeout(r,150));
  const R=sel=>{const e=doc.querySelector(sel);const b=e.getBoundingClientRect();return {sel,l:b.left,t:b.top,r:b.right,b:b.bottom}};
  const st=R('#stick'),zone={sel:'#stick (зона +16)',l:st.l-16,t:st.t-16,r:st.r+16,b:st.b+16};
  const items=[zone,R('#ability'),R('#toilet'),R('#status'),R('#objective'),R('#progress'),R('#gait'),R('.logo'),R('#levelName'),R('#need'),R('.hud-right')];
  const over=(a,b)=>!(a.r<=b.l||b.r<=a.l||a.b<=b.t||b.b<=a.t);const bad=[];
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j];
   if((a.sel.startsWith('#stick')&&b.sel==='#gait')||(a.sel==='#gait'&&b.sel.startsWith('#stick')))continue;   // the label sits over the stick's invisible grab margin by design
   if(over(a,b))bad.push(a.sel+' × '+b.sel)}
  const offscreen=items.filter(a=>a.l<0||a.t<0||a.r>w||a.b>h).map(a=>a.sel);
  check(`Раскладка ${w}×${h} без наложений`,!bad.length&&!offscreen.length,bad.length||offscreen.length?`наложения: ${bad.join(', ')||'нет'}; за краем: ${offscreen.join(', ')||'нет'}`:'проверено '+items.length+' элементов');f.remove()}

 const fails=results.filter(r=>r.kind==='fail').length;
 document.getElementById('sum').textContent=fails?`✗ Провалено: ${fails} из ${results.filter(r=>r.kind!=='info').length}`:`✓ Все тесты прошли (${results.filter(r=>r.kind!=='info').length})`;
 document.getElementById('sum').className=fails?'fail':'ok';window.testsDone=true}
run().catch(e=>{report('fail','Прогон упал',String(e&&e.stack||e));document.getElementById('sum').textContent='✗ Прогон упал';window.testsDone=true});
</script>
</body>
</html>
