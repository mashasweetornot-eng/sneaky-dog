<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sneaky Dog 3D — автотесты</title>
<style>
body{margin:16px;background:#0c241f;color:#fff5d9;font:14px/1.45 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 6px;color:#f8d36c}#sum{font-weight:800;margin:0 0 12px}
table{border-collapse:collapse;width:100%;max-width:1100px}td{padding:5px 8px;border-bottom:1px solid #ffffff1a;vertical-align:top}
td:first-child{width:22px;font-weight:900}.ok{color:#a8de8a}.fail{color:#ed6455}.info{color:#7fc6e8}
#frames iframe{border:1px solid #ffffff33;margin:8px 8px 0 0;background:#000}
</style>

<body>
<h1>Sneaky Dog 3D — автотесты</h1>
<p id="sum">Идёт прогон…</p>
<table id="out"></table>
<div id="frames"></div>
<script>
// Runs the game in iframes with ?test and drives it frame by frame through SneakyDog3D.test (deterministic, independent of
// the real clock). Run before every commit: open tests.html, wait for the summary line; window.testResults has the details.
'use strict';
const results=[];window.testResults=results;
function report(kind,name,detail){results.push({kind,name,detail});const tr=document.createElement('tr');
 tr.innerHTML=`<td class="${kind}">${kind==='ok'?'✓':kind==='fail'?'✗':'i'}</td><td>${name}</td><td>${detail}</td>`;document.getElementById('out').appendChild(tr)}
const check=(name,ok,detail)=>report(ok?'ok':'fail',name,detail);
function frame(w,h){return new Promise((res,rej)=>{const f=document.createElement('iframe');f.width=w;f.height=h;f.src='index.html?test&t='+Date.now();
 document.getElementById('frames').appendChild(f);const t0=Date.now();
 const poll=()=>{let g;try{g=f.contentWindow.SneakyDog3D}catch{}if(g&&g.test)res({f,G:g,T:g.test,win:f.contentWindow});else if(Date.now()-t0>30000)rej(new Error('игра не загрузилась за 30 с'));else setTimeout(poll,100)};poll()})}
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// Gardener standing still: outside the stops in his schedule (worst, < 8 s — the 3D-0.11 sticking bug), and in a chase (chaseWorst — a chase must never stand > 2 s).
function stillMonitor(T){const track=new Map();let worst=0,where=null,chaseWorst=0;
 return {tick(){for(const g of T.state().guards){let t=track.get(g);if(!t){t={x:g.x,y:g.y,s:0,cx:g.x,cy:g.y,c:0};track.set(g,t)}
   if(g.state==='chase'){if(Math.hypot(g.x-t.cx,g.y-t.cy)>6){t.cx=g.x;t.cy=g.y;t.c=0}else{t.c+=1/60;chaseWorst=Math.max(chaseWorst,t.c)}}else{t.cx=g.x;t.cy=g.y;t.c=0}
   // Planned stops: a scheduled wait, the short alert look, and the look-around once he reached (or gave up on) an
   // inspect / search point. The 3D-0.11 bug is a gardener that never reaches his point — that is still counted.
   const atPoint=(g.state==='inspect'||g.state==='search')&&(g.arrived||(g.target&&d2(g,g.target)<21));
   const planned=(g.state==='patrol'&&g.watch>0)||g.alertLook>0||atPoint;
   if(planned||Math.hypot(g.x-t.x,g.y-t.y)>6){t.x=g.x;t.y=g.y;t.s=0}else{t.s+=1/60;if(t.s>worst){worst=t.s;where={x:Math.round(g.x),y:Math.round(g.y),state:g.state}}}}},
  get worst(){return worst},get where(){return where},get chaseWorst(){return chaseWorst}}}

// A simple bot: follows A* waypoints with the stick in world directions.
function bot(T){let goal=null,path=[],repath=0;
 return {go(target,len){const p=T.state().player;if(!goal||d2(goal,target)>1){goal=target;path=[];repath=0}
   repath-=1/60;if(repath<=0){path=T.lineClear(p,goal,14)?[]:T.findPath(p,goal);repath=.5}
   let next=path[0]||goal;while(path.length&&d2(p,next)<14){path.shift();next=path[0]||goal}
   T.stick(next.x-p.x,next.y-p.y,len);return d2(p,goal)},
  stop(){T.stick(0,0,0)}}}

// Bot plays a whole level. A trip to the tap is meant for ONE deed, so it spreads them:
//  corner mark (far from the gardener) → hide in the bush (598,406) → 1st trip to the tap: the hydrant mark, back to the bush
//  → when he walks from his first round point to the second (east edge, facing away, too far to see the hedge gap) it slips
//  north through the gap by the hedge to the spot by the top fence (705,80), which nothing in his cycle ever sees (found by a
//  search over a full cycle) → 2nd trip: the pile on the bed (2.8 s away) → if he is still at the tap, run to the far exit;
//  if he is already coming back, slip into the north-east corner, out of his cone
//  and range, and leave when he walks to the east round point (or, if he found the pile, once he has run to the near exit).
// Level 3 (a wheelbarrow trip before the tap): from the near cover bush, the pile in two goes — or plan 'one': in one go.
// Leaving: 'safe' — duck into the bush, he finds the pile, then the far exit; 'risk' — run for the near exit at once.
function playLevel(T,breed,lv,plan='two',leave='safe'){T.start(breed,lv);const C=T.consts,B=bot(T),mon=stillMonitor(T);
 const deed=i=>T.state().deeds[i],[pileI,hydI,cornerI]=[0,1,2],bush={x:598,y:406},north=[{x:680,y:300},{x:684,y:226},{x:705,y:80}],ne={x:925,y:88},nearExit=C.EXITS.find(e=>e.id==='near'),farExit=C.EXITS.find(e=>e.id==='far');let out=[];const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
 const two=!!C.LEVELS[lv].barrow,cover=C.bushes.reduce((m,b)=>dist(b,C.zone)<dist(m,C.zone)?b:m),z=C.zone,dcz=dist(cover,z),holdSpot={x:z.x+(cover.x-z.x)*46/dcz,y:z.y+(cover.y-z.y)*46/dcz},coverIn={x:cover.x+(z.x-cover.x)*(cover.r-14)/dcz,y:cover.y+(z.y-cover.y)*(cover.r-14)/dcz};let p1=0,kept=null;
 let phase='toCorner',waited=0,trips=0,wasTap=false,wp=0;const log=[];const set=p=>{phase=p;log.push(p+'@'+T.state().elapsed.toFixed(1))};
 T.step(600,()=>{mon.tick();const s=T.state(),g=s.guards[0],tapIdx=g.pts.findIndex(p=>p.icon==='🚰'),r2=g.pts.findIndex(p=>p.x>900),cartIdx=g.pts.findIndex(p=>p.icon==='🛒');
  const onTrip=g.state==='patrol'&&g.idx===tapIdx,newTrip=onTrip&&!wasTap;wasTap=onTrip;
  switch(phase){
   case 'toCorner':if(B.go(deed(cornerI),.6)<12){B.stop();set('markCorner')}break;
   case 'markCorner':T.hold(true);if(deed(cornerI).done){T.hold(false);set('toBush')}break;
   case 'toBush':if(B.go(bush,.6)<10){B.stop();set(deed(hydI).done?'waitRound':'wait')}break;
   case 'wait':waited+=1/60;if(newTrip){trips++;set('toHydrant')}break;
   case 'toHydrant':if(B.go(deed(hydI),.7)<12){B.stop();set('markHydrant')}break;
   case 'markHydrant':T.hold(true);if(deed(hydI).done){T.hold(false);set('toBush')}break;
   case 'waitRound':waited+=1/60;if(g.state==='patrol'&&g.idx===r2&&!(g.watch>0)){wp=0;set('toNorth')}break;
   case 'toNorth':if(B.go(north[wp],.7)<10){if(++wp>=north.length){B.stop();set(two?'toCover':'waitNorth')}}break;
   // Level 3, the pile in two goes: short window (to the wheelbarrow) — first go, duck into the near bush while he glances back,
   // long window (to the tap) — finish it, duck again; then leave as below.
   case 'toCover':if(B.go(coverIn,.3)<6){B.stop();set('waitCart')}break;
   case 'waitCart':waited+=1/60;if(g.state==='patrol'&&g.idx===cartIdx&&!(g.watch>0)){trips++;set(plan==='one'?'waitTap':'toBed1')}break;
   case 'toBed1':if(B.go(holdSpot,.7)<5){B.stop();set('pile1')}break;
   case 'pile1':T.hold(true);if(deed(pileI).done||g.idx!==cartIdx||(g.watch>0&&g.watch<1.25)){T.hold(false);p1=deed(pileI).p;set(deed(pileI).done?'hide':'duck')}break;
   case 'duck':if(B.go(coverIn,.7)<6){B.stop();set('waitTap')}break;
   case 'waitTap':waited+=1/60;if(g.state==='patrol'&&g.idx===tapIdx){trips++;set('toBed2')}break;
   case 'toBed2':if(B.go(holdSpot,.7)<5){B.stop();kept=deed(pileI).p;set('pile2')}break;
   case 'pile2':T.hold(true);if(deed(pileI).done){T.hold(false);if(leave==='risk'){wp=0;out=[nearExit];set('toExit')}else set('hide')}break;
   case 'waitNorth':waited+=1/60;if(newTrip){trips++;set('toBed')}break;
   case 'toBed':if(B.go(deed(pileI),.7)<20){B.stop();set('pile')}break;
   case 'pile':T.hold(true);if(deed(pileI).done){T.hold(false);if(onTrip){wp=0;out=[farExit];set('toExit')}else set('hide')}break;
   case 'hide':if(B.go(two?coverIn:ne,two?.7:1)<6){B.stop();set('waitOut')}break;
   case 'waitOut':waited+=1/60;if(s.discovered?dist(g,nearExit)<120:g.state==='patrol'&&g.idx===r2&&!(g.watch>0)){wp=0;out=[farExit];set('toExit')}break;
   case 'toExit':if(B.go(out[wp],1)<10&&wp<out.length-1)wp++;break}});
 const s=T.state();return {state:s.state,elapsed:s.elapsed,spotted:s.spotted,accident:s.accident,discovered:s.discovered,phase,waited,trips,log,still:mon.worst,stillWhere:mon.where,chaseStill:mon.chaseWorst,two,p1,kept}}

// The gardener's window at the tap, measured in the simulation: how long the bed stays out of his sight around his stop
// at the tap. The dog is parked far away, out of everyone's way.
function measureWindow(T,lv){T.start('lab',lv);let t=0,lastSeen=0,inGap=false,gapStart=0,atTap=false;const wins=[];
 T.step(200,()=>{t+=1/60;T.place(150,640);const g=T.state().guards[0];const seen=T.bedSeen();
  if(!seen&&!inGap){inGap=true;gapStart=t;atTap=false}
  if(!seen&&g.state==='patrol'&&g.watch>0&&g.step?.icon==='🚰')atTap=true;
  if(seen&&inGap){inGap=false;if(atTap&&gapStart>0)wins.push(t-gapStart)}});
 return wins}

// Level 3's short window (to the wheelbarrow) and the glance between it and the long one (to the tap).
function measureCart(T,lv){T.start('lab',lv);let t=0,inGap=false,gapStart=0,atCart=false,atTap=false,cartEnd=null;const short=[],pause=[];
 T.step(200,()=>{t+=1/60;T.place(150,640);const g=T.state().guards[0],seen=T.bedSeen(),icon=g.state==='patrol'&&g.watch>0&&g.step?.icon;
  if(!seen&&!inGap){inGap=true;gapStart=t;atCart=false;atTap=false;if(cartEnd!==null){pause.push(t-cartEnd);cartEnd=null}}
  if(!seen&&icon==='🛒')atCart=true;if(!seen&&icon==='🚰')atTap=true;
  if(seen&&inGap){inGap=false;if(atCart&&!atTap&&gapStart>0){short.push(t-gapStart);cartEnd=t}else cartEnd=null}});
 return {short,pause}}

async function run(){
 // ---- 1. Bot passes every level with every playable breed; no gardener sticks. Bot times feed the par check (lab).
 const botTime={};
 {const {T,f}=await frame(844,390);const L=T.consts.LEVELS;
  for(let lv=0;lv<L.length;lv++)for(const breed of ['lab','jack','corgi']){const r=playLevel(T,breed,lv);if(breed==='lab')botTime[lv]=r.elapsed;
   check(`Бот проходит уровень ${lv+1} (${breed})`,r.state==='won',`итог ${r.state}, ${r.elapsed.toFixed(1)} с, ждал ${r.waited.toFixed(1)} с, отлучек ${r.trips}, заметили: ${r.spotted?'да':'нет'}, улику нашли: ${r.discovered?'да':'нет'}, авария: ${r.accident?'да':'нет'}; фазы: ${r.log.join(' → ')}`);
   check(`Садовник не стоит дольше 8 с вне расписания (уровень ${lv+1}, ${breed})`,r.still<8,`наибольший простой ${r.still.toFixed(1)} с${r.stillWhere?' в '+JSON.stringify(r.stillWhere):''}`);
   if(r.two)check(`Куча в два захода, уровень ${lv+1} (${breed})`,r.state==='won'&&r.p1>0&&r.p1<6&&r.kept>0,`первый заход ${r.p1.toFixed(1)} с, ко второму осталось ${r.kept===null?'—':r.kept.toFixed(1)+' с'}, итог ${r.state}`);
   check(`Садовник в погоне не стоит дольше 2 с (уровень ${lv+1}, ${breed})`,r.chaseStill<=2,`наибольший простой в погоне ${r.chaseStill.toFixed(1)} с`)}
  // Level 3: leaving before he finds the pile must be possible (run for the near exit at once) and must not be the default
  // (duck into the bush, take the safe far exit → he finds it and rages): a choice, not a fixed outcome. All breeds.
  for(let lv=0;lv<L.length;lv++)if(L[lv].barrow)for(const breed of ['lab','jack','corgi']){
   const risk=playLevel(T,breed,lv,'two','risk'),safe=playLevel(T,breed,lv,'two','safe');
   check(`Уровень ${lv+1}: можно уйти до того, как садовник найдёт кучу (${breed})`,risk.state==='won'&&!risk.discovered,`сразу к ближнему выходу: итог ${risk.state}, ${risk.elapsed.toFixed(1)} с, улику нашли: ${risk.discovered?'да':'нет'}, заметили: ${risk.spotted?'да':'нет'}`);
   check(`Уровень ${lv+1}: при неспешном уходе садовник находит кучу (${breed})`,safe.state==='won'&&safe.discovered,`нырок в куст, потом дальний выход: итог ${safe.state}, ${safe.elapsed.toFixed(1)} с, улику нашли: ${safe.discovered?'да':'нет'}`)}
  // Not a requirement: whether the pile also fits in one go in the long window (a bypass we keep, not plug) — for the notes.
  for(let lv=0;lv<L.length;lv++)if(L[lv].barrow){const r=playLevel(T,'lab',lv,'one');report('info',`Уровень ${lv+1} одним заходом в длинном окне (lab)`,`${r.state==='won'?'проходится':'не проходится'}: ${r.elapsed.toFixed(1)} с, заметили: ${r.spotted?'да':'нет'}, улику нашли: ${r.discovered?'да':'нет'}`)}
  T.start('lab',0);f.remove()}

 // ---- 2. Gardener sticking scenarios from 3D-0.11.
 {const {T,f}=await frame(844,390);const C=T.consts;
  const scen=[
   ['подозрение на куст, собаки там нет',g=>{g.state='patrol';g.watch=0;g.x=728;g.y=316;g.sus=.5;g.alertLook=.05;g.lookAt={x:598,y:406}}],
   ['цель внутри изгороди',g=>{g.state='inspect';g.target={x:343,y:240};g.x=483;g.y=360;g.wait=0;g.path=[]}],
   ['садовник внутри изгороди, погоня',g=>{g.state='chase';g.target={x:500,y:240};g.x=343;g.y=240;g.sus=1;g.seen=0;g.path=[]}],
   ['цель за забором',g=>{g.state='inspect';g.target={x:500,y:30};g.x=500;g.y=170;g.wait=0;g.path=[]}]];
  for(const [name,setup] of scen){T.start('lab');T.place(900,650);const g=T.state().guards[0];setup(g);const mon=stillMonitor(T);let back=null;
   T.step(25,t=>{T.place(900,650);mon.tick();if(back===null&&g.state==='patrol'&&t>.2)back=t});
   check(`Садовник не залипает: ${name}`,mon.worst<8&&back!==null,`вернулся к патрулю через ${back===null?'—':back.toFixed(1)+' с'}, наибольший простой ${mon.worst.toFixed(1)} с`)}
  f.remove()}

 // ---- 2b. Chase stall (3D-1.2): the dog pressed against a trunk (its point moves to a free cell right under the gardener,
 // just out of catch range) or behind a hedge. In a chase he never stands > 2 s: he catches, goes round, or gives up.
 {const {T,f}=await frame(844,390);
  const scen=[['собака прижалась к стволу',{x:900,y:262},{x:873,y:262}],['собака за изгородью, 4 м',{x:370,y:250},{x:300,y:250}],
   ['собака у изгороди, вплотную',{x:362,y:250},{x:300,y:250}]];
  for(const [name,dog,gp] of scen){T.start('lab');T.place(dog.x,dog.y);const g=T.state().guards[0];Object.assign(g,{state:'chase',x:gp.x,y:gp.y,target:{...dog},sus:1,seen:0,path:[],repath:0});
   const mon=stillMonitor(T);let end=null;
   T.step(12,t=>{if(T.state().state==='playing')T.place(dog.x,dog.y);mon.tick();if(end===null&&(T.state().state!=='playing'||g.state!=='chase'))end={t,how:T.state().state==='lost'?'поймал':g.state}});
   if(end===null&&T.state().state==='lost')end={t:T.state().elapsed,how:'поймал'};
   check(`Погоня не стоит на месте: ${name}`,mon.chaseWorst<=2,`наибольший простой в погоне ${mon.chaseWorst.toFixed(1)} с; ${end?`${end.how} через ${end.t.toFixed(1)} с`:'всё ещё погоня через 12 с'}`)}
  f.remove()}

 // ---- 3. Stamina never sticks at zero with the stick held; the dog keeps walking and recovers on release.
 {const {T,f}=await frame(844,390);T.start('lab');T.state().guards[0].x=900;T.state().guards[0].y=650;
  let reachedRun=false,minAfter=9,zeroT=0,dry=null;
  T.step(25,t=>{T.place(400,420);T.stick(1,0,1);const s=T.state();if(s.speedMult>1.3)reachedRun=true;if(reachedRun&&s.stamina<20)minAfter=Math.min(minAfter,s.speedMult);if(s.stamina<.01)zeroT+=1/60;if(dry===null&&s.stamina<5)dry=t});
  const low=T.state().stamina;T.step(6,()=>{T.place(400,420);T.stick(1,0,.6)});const rec=T.state().stamina;
  check('Выносливость не залипает на нуле при зажатом стике',reachedRun&&minAfter>=.98&&zeroT<.5&&rec>40,`бег был: ${reachedRun?'да':'нет'}; после исчерпания скорость не ниже ×${minAfter.toFixed(3)}; на нуле ${zeroT.toFixed(2)} с; выдохлась к ${dry===null?'—':dry.toFixed(1)+' с'}; через 6 с шага выносливость ${low.toFixed(1)} → ${rec.toFixed(1)}`);
  f.remove()}

 // ---- 4. Noise ring edge and the gardener's reaction coincide.
 {const {T,f}=await frame(844,390);const rows=[];let ok=true;
  for(const D of [120,150,164,170,200]){T.start('lab');const g=T.state().guards[0];
   // The gardener stands still, back to the dog; until our ring is out he is kept in patrol (earlier, quieter rings are ignored).
   const pin=()=>{T.place(400,420);g.x=400+D;g.y=420;g.angle=0;g.lookBase=0;g.watch=600;g.step={icon:'💧',sp:0,amp:0};g.sus=0;g.alertLook=0};
   let ring=null;for(let i=0;i<360&&!ring;i++){pin();g.state='patrol';T.stick(1,0,1);T.step(1/60);ring=T.state().rings.find(r=>r.rad>160&&r.age<.05)||null}
   T.stick(0,0,0);for(const r of T.state().rings)if(r!==ring)r.heard.add(g);g.state='patrol';const hold=pin;
   let heardAt=null,edge=null;T.step(1.5,()=>{hold();if(heardAt===null&&g.state==='inspect'){heardAt=ring.age;edge=ring.rad*Math.min(1,ring.age/ring.life)}});
   const should=ring&&D<=ring.rad,fine=!!ring&&(should?heardAt!==null&&Math.abs(edge-D)<=3:heardAt===null);ok=ok&&fine;
   rows.push(`${D}: ${heardAt!==null?'услышал при крае '+edge.toFixed(1):'не услышал'}${fine?'':' ✗'}`)}
  check('Край кольца шума и реакция садовника совпадают',ok,`радиус ${T.consts.NOISE} · `+rows.join(' · '));f.remove()}

 // ---- 5. Deeds: progress holds DEED_GRACE s after a break, then drains 1.5× faster; a pile can be done in two goes; need overflow.
 // The gardener is parked at the tap, back to the park, for the whole check.
 const park=g=>{g.state='patrol';g.x=230;g.y=182;g.watch=9999;g.step={icon:'🚰',sp:0,amp:0};g.lookBase=-Math.PI/2;g.angle=-Math.PI/2};
 {const {T,f}=await frame(844,390);T.start('lab');const C=T.consts,s=T.state(),pile=s.deeds[0];park(s.guards[0]);
  T.place(pile.x,pile.y);T.stick(0,0,0);T.hold(true);T.step(3,()=>T.place(pile.x,pile.y));T.hold(false);const p3=pile.p;
  T.step(1.5);const pGrace=pile.p;T.step(1.5);const pDrain=pile.p;
  T.hold(true);T.step(C.DEED_KIND.pile.hold,()=>T.place(pile.x,pile.y));T.hold(false);
  const expDrain=p3-(1.5-(C.DEED_GRACE-1.5))*C.DEED_DRAIN;
  check('Срыв дела не мгновенный, куча в два захода',Math.abs(pGrace-p3)<.02&&Math.abs(pDrain-expDrain)<.05&&pile.done,`3 с удержания → ${p3.toFixed(2)}; через 1.5 с без кнопки ${pGrace.toFixed(2)}; через 3 с ${pDrain.toFixed(2)} (ожидалось ${expDrain.toFixed(2)}); второй заход — куча ${pile.done?'готова':'не готова'}`);
  T.start('lab');const s2=T.state();park(s2.guards[0]);T.step(C.NEED_TIME+.5,()=>T.place(598,406));const s3=T.state();
  check('Потребность: переполнение — дело на месте, улика, без проигрыша',s3.accident&&s3.deeds[0].done&&s3.evidence.length===1&&s3.state==='playing',`через ${C.NEED_TIME} с: авария ${s3.accident?'да':'нет'}, куча засчитана ${s3.deeds[0].done?'да':'нет'}, улик ${s3.evidence.length}, состояние ${s3.state}`);
  f.remove()}

 // ---- 6. The gardener's window per level, measured in the simulation, within its target ±2 s (catches map edits that
 // shift it); the GDD 3.2 rule (one pile + 4–6 s) is about one deed per trip.
 {const {T,f}=await frame(844,390);const L=T.consts.LEVELS,pile=T.consts.DEED_KIND.pile.hold;
  for(let lv=0;lv<L.length;lv++){const w=measureWindow(T,lv),avg=w.length?w.reduce((a,b)=>a+b,0)/w.length:NaN;
   check(`Окно садовника, уровень ${lv+1}: ${L[lv].window} ± 2 с`,w.length>0&&w.every(x=>Math.abs(x-L[lv].window)<=2),`замерено ${w.map(x=>x.toFixed(1)).join(', ')||'—'} с (пауза у крана ${L[lv].tapWait} с); куча ${pile} с — ${avg>=pile+4?'влезает с запасом':avg>=pile?'влезает впритык':'в одно окно не влезает'}`)}
  // ---- 6a. Level 3: a second, short trip (to the wheelbarrow) with a glance back at the bed before the long one — the pile
  // in two goes needs the glance short enough for part of the first go to survive (grace DEED_GRACE s, then drain ×DEED_DRAIN).
  for(let lv=0;lv<L.length;lv++){const b=L[lv].barrow;if(!b)continue;const {short,pause}=measureCart(T,lv);
   check(`Короткое окно (тачка), уровень ${lv+1}: ${b.window} ± 1.5 с`,short.length>0&&short.every(x=>Math.abs(x-b.window)<=1.5),`замерено ${short.map(x=>x.toFixed(1)).join(', ')||'—'} с (пауза у тачки ${b.wait} с)`);
   check(`Пауза между окнами, уровень ${lv+1}: не больше 6 с`,pause.length>0&&pause.every(x=>x<=6),`замерено ${pause.map(x=>x.toFixed(1)).join(', ')||'—'} с (оглядка на клумбу ${b.glance} с)`)}
  // ---- 6b. Par time = lab bot time × 1.8 rounded up to 5 s; must stay within 1.4–2.4 × bot time.
  for(let lv=0;lv<L.length;lv++){const b=botTime[lv],par=L[lv].par,want=Math.ceil(b*1.8/5)*5;
   check(`Время на третью звезду, уровень ${lv+1}`,b>0&&par>=1.4*b&&par<=2.4*b,`бот ${b?b.toFixed(1):'—'} с → par ${par} с (${b?(par/b).toFixed(2):'—'}× бота, допустимо 1.4–2.4×; по формуле ×1.8 вышло бы ${b?want:'—'} с)`)}
  f.remove()}

 // ---- 6c. The gardener pointer stays inside the safe area and off the stick and action buttons (±8 px).
 for(const [w,h] of [[844,390],[932,430]]){const {T,win,f}=await frame(w,h);T.start('lab',0);T.step(.2);const doc=win.document,gp=doc.getElementById('gptr'),s=T.state(),g=s.guards[0];
  const zone=e=>{const z=e.getBoundingClientRect();return {l:z.left-8,r:z.right+8,t:z.top-8,b:z.bottom+8}},zs=[zone(doc.getElementById('stick')),zone(doc.querySelector('.actions'))];
  let shown=0,lowLeft=0,lowRight=0;const bad=[];
  for(let k=0;k<24;k++){const a=k*Math.PI/12;T.place(500,400);g.x=500+Math.cos(a)*330;g.y=400+Math.sin(a)*330;g.state='patrol';g.watch=99;g.step={icon:'💧',sp:0,amp:0};T.render();
   if(gp.style.display!=='flex')continue;shown++;const r=gp.getBoundingClientRect();if(r.top>h*.5&&r.left<w*.3)lowLeft++;if(r.top>h*.4&&r.right>w*.7)lowRight++;
   const inSafe=r.left>=11.5&&r.top>=11.5&&r.right<=w-11.5&&r.bottom<=h-11.5,hit=zs.some(z=>!(r.right<=z.l||z.r<=r.left||r.bottom<=z.t||z.b<=r.top));
   if(!inSafe||hit)bad.push(`${k*15}°: ${!inSafe?'вне безопасной области':'на управлении'}`)}
  check(`Указатель на садовника не на управлении, ${w}×${h}`,!bad.length&&shown>0,`садовник в 24 направлениях: указатель показан ${shown} раз, у левого нижнего края ${lowLeft}, у правого ${lowRight}; ${bad.length?'нарушения: '+bad.join(', '):'нарушений нет'}`);f.remove()}

 // ---- 7. Landscape layout: no overlaps on 844×390 and 932×430 (progress and gait label forced visible).
 for(const [w,h] of [[844,390],[932,430]]){const {T,win,f}=await frame(w,h);T.start('lab');T.step(.1);const doc=win.document;
  doc.getElementById('progress').style.display='block';const ga=doc.getElementById('gait');ga.hidden=false;ga.textContent='крадётся';doc.getElementById('need').hidden=false;
  await new Promise(r=>setTimeout(r,150));
  const R=sel=>{const e=doc.querySelector(sel);const b=e.getBoundingClientRect();return {sel,l:b.left,t:b.top,r:b.right,b:b.bottom}};
  const st=R('#stick'),zone={sel:'#stick (зона +16)',l:st.l-16,t:st.t-16,r:st.r+16,b:st.b+16};
  const items=[zone,R('#ability'),R('#toilet'),R('#status'),R('#objective'),R('#progress'),R('#gait'),R('.logo'),R('#levelName'),R('#need'),R('.hud-right')];
  const over=(a,b)=>!(a.r<=b.l||b.r<=a.l||a.b<=b.t||b.b<=a.t);const bad=[];
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j];
   if((a.sel.startsWith('#stick')&&b.sel==='#gait')||(a.sel==='#gait'&&b.sel.startsWith('#stick')))continue;   // the label sits over the stick's invisible grab margin by design
   if(over(a,b))bad.push(a.sel+' × '+b.sel)}
  const offscreen=items.filter(a=>a.l<0||a.t<0||a.r>w||a.b>h).map(a=>a.sel);
  check(`Раскладка ${w}×${h} без наложений`,!bad.length&&!offscreen.length,bad.length||offscreen.length?`наложения: ${bad.join(', ')||'нет'}; за краем: ${offscreen.join(', ')||'нет'}`:'проверено '+items.length+' элементов');f.remove()}

 const fails=results.filter(r=>r.kind==='fail').length;
 document.getElementById('sum').textContent=fails?`✗ Провалено: ${fails} из ${results.filter(r=>r.kind!=='info').length}`:`✓ Все тесты прошли (${results.filter(r=>r.kind!=='info').length})`;
 document.getElementById('sum').className=fails?'fail':'ok';window.testsDone=true}
run().catch(e=>{report('fail','Прогон упал',String(e&&e.stack||e));document.getElementById('sum').textContent='✗ Прогон упал';window.testsDone=true});
</script>
