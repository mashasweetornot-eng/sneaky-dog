  const alarm=g.state==='chase'?'!':g.sus>0||g.state==='inspect'||g.state==='search'?'?':'';ic.className='ic'+(alarm==='!'?' x':alarm?' q':'');ic.textContent=(alarm||(g.state==='patrol'&&g.watch>0&&g.step?.icon)||'')+(g.angry?'💢':'');
  bar.style.visibility=g.sus>0&&g.state!=='chase'?'visible':'hidden';bar.firstChild.style.width=g.sus*100+'%'}
 const t=performance.now()/1000;
 // Deed spots pulse until done, then fade to a faint green ring around the result.
 for(const d of deeds){const m=d.ring.material;if(d.done){m.color.set('#a8de8a');m.opacity=.25}else{m.color.set(d.K.color);m.opacity=.5+Math.sin(t*4)*.25}}for(const r of exitRings)r.material.opacity=done?.6+Math.sin(t*4)*.3:.3;

 // Arrow to the goal when it is off screen.
 const todo=deeds.filter(d=>!d.done),goal=done||!todo.length?nearestExit(player):todo.reduce((a,d)=>dist(player,d)<dist(player,a)?d:a),ar=$('arrow');v3.set(goal.x*U,.3,goal.y*U).project(camera);let gx=v3.x,gy=v3.y;if(v3.z>1){gx=-gx;gy=-gy}
 if(state==='playing'&&(v3.z>1||Math.abs(gx)>.92||Math.abs(gy)>.86)){const m=Math.max(Math.abs(gx)/.8,Math.abs(gy)/.62,1e-3);const px=(gx/m*.5+.5)*screenW,py=(-gy/m*.5+.5)*screenH;ar.style.display='flex';ar.style.transform=`translate(${px-22}px,${py-22}px) rotate(${Math.atan2(-gy,gx)+Math.PI/2}rad)`}else ar.style.display='none';
 // Pointer to the gardener when he is out of frame (behind or to the side), with distance: no blind spot behind the camera.
 const gp=$('gptr'),g=guards[0];if(g&&state==='playing'){v3.set(g.x*U,1.6,g.y*U).project(camera);let qx=v3.x,qy=v3.y;const behind=v3.z>1;if(behind){qx=-qx;qy=-qy;if(Math.abs(qy)<.3)qy=-1}
  if(behind||Math.abs(qx)>.96||Math.abs(qy)>.94){const m=Math.max(Math.abs(qx)/.84,Math.abs(qy)/.62,1e-3),px=(qx/m*.5+.5)*screenW,py=(-qy/m*.5+.5)*screenH;gp.style.display='flex';gp.className=g.state==='chase'?'x':g.sus>0||g.state==='inspect'||g.state==='search'?'q':'';gp.firstChild.style.transform=`rotate(${Math.atan2(-qy,qx)}rad)`;gp.lastChild.textContent=Math.round(dist(g,player)*U)+' м';placePointer(gp,px,py)}else gp.style.display='none'}else gp.style.display='none'}

function resize(){readSafe();const app=$('app'),vh=Math.round(window.visualViewport?.height||innerHeight);app.style.height=vh+'px';screenW=Math.round(app.getBoundingClientRect().width)||innerWidth;screenH=vh;renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(screenW,screenH);applyFov();lastVW=innerWidth;lastVH=vh}
window.visualViewport?.addEventListener('resize',resize);window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,300));
function loop(t){requestAnimationFrame(loop);if(innerWidth!==lastVW||Math.round(window.visualViewport?.height||innerHeight)!==lastVH)resize();const dt=Math.min((t-lastTime)/1000,.033);lastTime=t;
 fpsN++;fpsT+=Math.min((t-(loop.prev??t))/1000,1);loop.prev=t;if(fpsT>=.5){fps=Math.round(fpsN/fpsT);fpsN=0;fpsT=0}
 if(!TEST)update(dt);updateCamera(dt);syncScene(dt);renderer.render(scene,camera)}

// The park measured in time, from the frozen numbers and the breed (debug only: SneakyDog3D.snapshot().metrics).
// Paths are real walking routes (the same A* the gardener uses); runs go through speedStep, so stamina is included.
function pathLen(a,b){let L=0,prev=a;for(const q of [...findPath(a,b),b]){L+=dist(prev,q);prev=q}return L}
function travelTime(metres,want,panic=false){const st={mult:0,stamina:DOG.stamina},dt=.05;let x=0,t=0;while(x<metres&&t<300){speedStep(DOG,st,want,dt,panic&&t<=PANIC_MAX);x+=DOG.speed*TEMPO*.06*st.mult*dt;t+=dt}return t}
function mapMetrics(){const B=DOG,u=.06*MAP_SCALE,walk=B.speed*TEMPO*.06,gv=LV.speed*TEMPO*.06;
 // Retreat: the walkable route (A*) from the bed to each exit; "panic" = run during a chase, "calm" = run with the normal stamina.
 const exits=EXITS.map(e=>{const m=pathLen(zone,e)*u;return {id:e.id,m,panic:travelTime(m,B.runMult,true),calm:travelTime(m,B.runMult)}}).sort((a,b)=>a.m-b.m);
 const tap=TAP_STAND,toTap=pathLen(BED,tap)*u,back=pathLen(tap,BED)*u;
 // Nearest cover: from standing hidden in a bush to standing in the bed zone, edge to edge.
 const bushGap=Math.min(...bushes.map(b=>Math.max(0,dist(b,zone)-(b.r-8)-zone.r)))*u;
 // Gardener's window at the tap: walking away he faces away from the bed; on the way back he sees it again from vision range.
 const window=toTap/gv+LEVELS[level].tapWait+Math.max(0,back-LV.vision*u)/gv;
 return {dogLen:B.len,parkW:916*u,parkH:647*u,diagWalk:Math.hypot(916,647)*u/walk,exits,bushToBed:bushGap/walk,window,needWindow:[DEED_KIND.pile.hold+4,DEED_KIND.pile.hold+6],
  // All deeds in one window: holds plus walking bed → hydrant → flower-box corner (the mark spots of this level).
  allDeeds:LEVEL_DEEDS.reduce((s,d)=>s+DEED_KIND[d.kind].hold,0)+(pathLen(zone,LEVEL_DEEDS[1])+pathLen(LEVEL_DEEDS[1],LEVEL_DEEDS[2]))*u/walk}}

// ---------- Input (same scheme as 2D) ----------
// Knob travel ~55 px on the 150 px stick (50 px on the 132 px landscape one): a longer travel doses speed more precisely.
function setJoy(e){const r=$('stick').getBoundingClientRect(),max=clamp(r.width*.37,50,56);let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy);if(l>max){dx*=max/l;dy*=max/l}joy.x=dx/max;joy.y=dy/max;$('knob').style.transform=`translate(${dx}px,${dy}px)`}
$('stick').addEventListener('pointerdown',e=>{inputMode='touch';if(state!=='playing'||joy.id!==null)return;e.preventDefault();joy.id=e.pointerId;try{$('stick').setPointerCapture(e.pointerId)}catch{}setJoy(e)});$('stick').addEventListener('pointermove',e=>{if(e.pointerId===joy.id)setJoy(e)});
function resetJoy(e){if(e.pointerId===joy.id){joy={x:0,y:0,id:null};$('knob').style.transform=''}}for(const t of ['pointerup','pointercancel','lostpointercapture'])$('stick').addEventListener(t,resetJoy);
$('toilet').addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();$('toilet').setPointerCapture(e.pointerId);toiletHeld=true;$('toilet').classList.add('active');if(!done&&!nearDeed)toast('Подойди к гидранту, углу клумбы или к большой клумбе')});
for(const t of ['pointerup','pointercancel','lostpointercapture'])$('toilet').addEventListener(t,()=>{toiletHeld=false;$('toilet').classList.remove('active')});
$('ability').addEventListener('pointerdown',e=>{e.preventDefault();ability()});$('ability').onclick=e=>{if(e.detail===0)ability()};
// Gestures on the empty field (the stick and buttons sit above the canvas, so nothing here can start on them):
// one finger — orbit (horizontal: yaw, swipe right looks right; vertical: pitch, swipe up looks up), scaled by half the screen width;
// two fingers — pinch zoom of the distance, continuous. When a second finger lands the orbit stops on the spot;
// when one is lifted the zoom stops (no inertia) and the remaining finger orbits again from where it is now.
const zoomTo=k=>{view.k=clamp(k,ZOOM.min,ZOOM.max)};
const pinchSpan=()=>{const [a,b]=[...touches.values()];return Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))};
canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();touches.set(e.pointerId,{x:e.clientX,y:e.clientY});try{canvas.setPointerCapture(e.pointerId)}catch{}
 if(touches.size===1)drag={id:e.pointerId,x:e.clientX,y:e.clientY};
 else if(touches.size===2){drag=null;pinch={span:pinchSpan(),k:view.k}}});
canvas.addEventListener('pointermove',e=>{const p=touches.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
 if(pinch&&touches.size>=2){zoomTo(pinch.k*Math.pow(pinch.span/pinchSpan(),PINCH));return}
 if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,half=Math.max(200,screenW)/2;drag.x=e.clientX;drag.y=e.clientY;camState.off+=dx/half*SWIPE.sens*D2R;camState.poff+=dy/half*SWIPE.sensY*D2R});
for(const t of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(t,e=>{if(!touches.delete(e.pointerId))return;
 if(drag&&e.pointerId===drag.id)drag=null;
 if(pinch&&touches.size<2){pinch=null;saveView();if(touches.size===1){const [[id,p]]=[...touches];drag={id,x:p.x,y:p.y}}}});
// Mouse wheel zooms too (handy for tuning) and never scrolls the page.
let wheelSave=0;canvas.addEventListener('wheel',e=>{e.preventDefault();zoomTo(view.k*Math.exp(e.deltaY*.0015*PINCH));clearTimeout(wheelSave);wheelSave=setTimeout(saveCfg,300)},{passive:false});
$('pause').onclick=pause;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'♪':'♫';$('sound').setAttribute('aria-label',muted?'Включить звук':'Выключить звук');beep(660,.1)};
const CODES={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',KeyE:'e',KeyC:'c',KeyQ:'q',KeyR:'r',Space:' ',ShiftLeft:'shift',ShiftRight:'shift',ArrowUp:'arrowup',ArrowDown:'arrowdown',ArrowLeft:'arrowleft',ArrowRight:'arrowright',Escape:'escape'};const keyOf=e=>CODES[e.code]||(e.key||'').toLowerCase();
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=keyOf(e);if(CODES[e.code])inputMode='keys';if([' ','arrowup','arrowdown','arrowleft','arrowright','shift'].includes(k))e.preventDefault();if(k==='escape'){if(state==='playing')pause();else if(state==='paused')$('resume').click();return}if(state!=='playing')return;keys.add(k);if(k==='e'&&!e.repeat)ability()});
window.addEventListener('keyup',e=>keys.delete(keyOf(e)));window.addEventListener('blur',()=>{if(TEST)return;if(state==='playing')pause();clearInput()});document.addEventListener('visibilitychange',()=>{if(!TEST&&document.hidden&&state==='playing')pause()});canvas.addEventListener('contextmenu',e=>e.preventDefault());

// Read-only hook for build verification and debugging; it never changes game state.
// Park measurements depend only on the frozen numbers and the breed, so they are computed once per breed.
const metricsCache={},metricsNow=()=>metricsCache[breedId+'/'+level]??=mapMetrics();
window.SneakyDog3D={version:VERSION,metrics:metricsNow,snapshot:()=>({version:VERSION,state,player:player?{x:+player.x.toFixed(1),y:+player.y.toFixed(1),mode:player.mode,hidden:hiddenNow,mult:+speedMult.toFixed(3),panic:panicNow,panicT:+panicT.toFixed(2)}:null,breed:breedId,guards:guards.map(g=>({x:+g.x.toFixed(1),y:+g.y.toFixed(1),state:g.state,idx:g.idx,watch:+g.watch.toFixed(2),icon:g.step?.icon||null,angry:g.angry,sus:+g.sus.toFixed(2)})),done,discovered,deeds:deeds.map(d=>({kind:d.kind,x:d.x,y:d.y,p:+d.p.toFixed(2),done:d.done})),need:+need.toFixed(3),accident,evidence:evidence.length,elapsed:+elapsed.toFixed(2),stamina:Math.round(stamina),view:{...view},metrics:metricsNow(),camera:{x:+camera.position.x.toFixed(2),y:+camera.position.y.toFixed(2),z:+camera.position.z.toFixed(2),fov:+camera.fov.toFixed(1),yaw:+(camYaw()/D2R).toFixed(1),off:+(camState.off/D2R).toFixed(1),pitch:+(camState.pitch/D2R).toFixed(1),poff:+(camState.poff/D2R).toFixed(1),dist:+camState.dist.toFixed(2),eff:+camState.eff.toFixed(2),lift:+(camState.lift/D2R).toFixed(1),zoom:view.k,dragging:!!drag},screen:{w:screenW,h:screenH,canvas:[canvas.width,canvas.height]},fps})};

// Test hooks (only with ?test): start a round, drive the stick in world directions, hold the action button, step the
// simulation by fixed frames and read the live state. tests.html uses them; nothing here runs in normal play.
if(TEST)window.SneakyDog3D.test={
 start(breed='lab',lv=0){setBreed(breed);setLevel(lv);begin()},
 // Whether any gardener sees the bed right now (the same test as for evidence): the window is the time this stays false.
 bedSeen:()=>guards.some(g=>{const vis=LV.vision*(g.angry?1.15:1),dz=dist(g,zone),az=Math.atan2(zone.y-g.y,zone.x-g.x)-g.angle;return dz<vis&&Math.abs(Math.atan2(Math.sin(az),Math.cos(az)))<.64&&lineClear(g,zone)}),
 // Advance the game by `sec` seconds in 1/60 s frames; onTick(t) runs before each frame (bots steer there).
 step(sec,onTick){const n=Math.round(sec*60);for(let i=0;i<n&&state==='playing';i++){onTick?.(i/60);update(1/60)}},
 // Stick towards a world direction (map units) with deflection len (0 releases it). The stick is camera-relative in the game,
 // so this turns the wanted direction back through the camera yaw.
 stick(wx,wy,len){if(!len||!(wx||wy)){joy={x:0,y:0,id:null};return}const l=Math.hypot(wx,wy),x=wx/l,y=wy/l,c=Math.cos(camYaw()),s=Math.sin(camYaw());joy={x:(x*c+y*s)*len,y:(-x*s+y*c)*len,id:'test'}},

 // One presentation frame (camera, HUD pointers) without waiting for requestAnimationFrame, which a hidden window may not run.
 render(){updateCamera(1/60);syncScene(1/60)},
 state:()=>({state,player,guards,deeds,rings,stamina,speedMult,done,need,accident,evidence,spotted,discovered,elapsed,panicNow}),

 findPath:(a,b)=>findPath(a,b),blocked:(x,y,r)=>blocked(x,y,r),lineClear:(a,b,m)=>lineClear(a,b,m),
 consts:{NOISE,EXITS,LEVEL_DEEDS,DEED_KIND,STICK,bushes,zone,BED,TAP:TAP_STAND,LEVELS,NEED_TIME,DEED_GRACE,DEED_DRAIN}};
